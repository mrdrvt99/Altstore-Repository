name: Check for Updates

on:
  schedule:
    - cron: '0 */13 * * *'
  workflow_dispatch:

concurrency:
  group: sync-altstore
  cancel-in-progress: false

jobs:
  sync:
    name: Check and Update source files
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout AltStore Repo
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Fetch YouProEXTRA Latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, urllib.error, os, re, sys
          from datetime import datetime, timezone

          SOURCE_REPO = 'mrdrvt99/YouProEXTRA'
          GH_TOKEN    = os.environ.get('GH_TOKEN', '')

          TAG_MAP = {
              'youmod-ipa':                'youmod',
              'youproextra-ipa':           'youpro',
              'ytkp-ipa':                  'ytkp',
              'ytkace-ipa':                'ytkace',
          }

          FILES = {
              'ytkp':   'ytkp.json',
              'youpro': 'youpro.json',
              'youmod': 'youmod.json',
              'ytkace': 'ytkace.json',
          }

          YTLITE_TAG_PREFIX = 'ytl-ipa'
          YTLITE_FILE       = 'ytlite.json'

          def fetch_json(url):
              headers = {'User-Agent': 'github-actions/altstore-sync'}
              if GH_TOKEN:
                  headers['Authorization'] = f'token {GH_TOKEN}'
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return json.loads(resp.read().decode())
              except urllib.error.URLError as e:
                  msg  = e.reason if hasattr(e, 'reason') else str(e)
                  code = e.code   if hasattr(e, 'code')   else 'N/A'
                  print(f"::error::API request failed (HTTP {code}): {msg}")
                  sys.exit(1)

          def fetch_all_releases(repo, max_pages=10):
              """Paginate through releases so older tags (e.g. ytl-ipa0/1)
              aren't missed just because newer tags from other mods pushed
              them off the first page."""
              results = []
              for page in range(1, max_pages + 1):
                  batch = fetch_json(
                      f'https://api.github.com/repos/{repo}/releases?per_page=100&page={page}'
                  )
                  if not batch:
                      break
                  results.extend(batch)
                  if len(batch) < 100:
                      break
              return results

          all_releases = fetch_all_releases(SOURCE_REPO)
          published = [r for r in all_releases if not r['draft'] and not r['prerelease']]
          ytlite_candidates = [r for r in all_releases if not r['draft']]

          best = {}
          ytlite_releases = []
          for release in ytlite_candidates:
              tag = release['tag_name']
              if tag.startswith(YTLITE_TAG_PREFIX):
                  ytlite_releases.append(release)

          for release in published:
              tag = release['tag_name']
              if tag.startswith('youproextra-noytlite-ipa'):
                  continue
              if tag.startswith(YTLITE_TAG_PREFIX):
                  continue
              for prefix, key in TAG_MAP.items():
                  if tag.startswith(prefix) and key not in best:
                      best[key] = release
                      break

          if not best and not ytlite_releases:
              print("No matching releases found.")
              sys.exit(0)

          if ytlite_releases:
              found_tags = sorted(r['tag_name'] for r in ytlite_releases)
              print(f"Found {len(ytlite_releases)} ytl-ipa release(s): {found_tags}")

          for app_key, release in best.items():
              tag          = release['tag_name']
              published_at = release.get('published_at', '')
              date_str     = published_at[:10] if published_at else datetime.now(timezone.utc).strftime('%Y-%m-%d')
              release_body = (release.get('body') or '').strip()

              ipa_asset = next(
                  (a for a in release.get('assets', []) if a['name'].endswith('.ipa')),
                  None
              )
              if not ipa_asset:
                  print(f"No .ipa asset for {tag} — skipping.")
                  continue

              download_url = ipa_asset['browser_download_url']
              size         = ipa_asset['size']
              ipa_name     = ipa_asset['name']

              filename = FILES[app_key]
              with open(filename, 'r') as f:
                  source = json.load(f)

              app = source['apps'][0]

              if app.get('downloadURL') == download_url:
                  print(f"{filename} already up to date.")
                  continue

              matches = re.findall(r'(\d+\.\d+\.\d+)', ipa_name)
              if not matches:
                  print(f"::warning::Could not parse version from '{ipa_name}' — skipping.")
                  continue
              yt_version = matches[0]

              ipa_label   = ipa_name.replace('.ipa', '')
              description = (
                  f"YouTube {yt_version} | {ipa_label}\n\n{release_body}"
                  if release_body else
                  f"YouTube {yt_version} | {ipa_label}"
              )

              new_entry = {
                  "version":              yt_version,
                  "date":                 date_str,
                  "localizedDescription": description,
                  "downloadURL":          download_url,
                  "size":                 size,
                  "minOSVersion":         "16.0"
              }

              app['versions']           = [new_entry]
              app['version']            = yt_version
              app['versionDate']        = date_str
              app['versionDescription'] = description
              app['downloadURL']        = download_url
              app['size']               = size

              with open(filename, 'w') as f:
                  json.dump(source, f, indent=2, ensure_ascii=False)
                  f.write('\n')

              print(f"Updated {filename}: '{app['name']}' → YouTube {yt_version} ({tag})")

          if ytlite_releases:
              def ytlite_tag_num(release):
                  m = re.search(r'ytl-ipa(\d+)', release['tag_name'])
                  return int(m.group(1)) if m else -1

              YTLITE_MIN_OS = {
                  0: "17.0",
                  1: "14.0",
                  2: "15.0",
              }
              YTLITE_MIN_OS_DEFAULT = "16.0"

              ytlite_releases.sort(key=ytlite_tag_num, reverse=True)

              entries = []
              for release in ytlite_releases:
                  tag          = release['tag_name']
                  tag_num      = ytlite_tag_num(release)
                  min_os       = YTLITE_MIN_OS.get(tag_num, YTLITE_MIN_OS_DEFAULT)
                  published_at = release.get('published_at', '')
                  date_str     = published_at[:10] if published_at else datetime.now(timezone.utc).strftime('%Y-%m-%d')
                  release_body = (release.get('body') or '').strip()

                  ipa_asset = next(
                      (a for a in release.get('assets', []) if a['name'].endswith('.ipa')),
                      None
                  )
                  if not ipa_asset:
                      print(f"No .ipa asset for {tag} — skipping.")
                      continue

                  download_url = ipa_asset['browser_download_url']
                  size         = ipa_asset['size']
                  ipa_name     = ipa_asset['name']

                  matches = re.findall(r'(\d+\.\d+\.\d+)', ipa_name)
                  if not matches:
                      print(f"::warning::Could not parse version from '{ipa_name}' — skipping.")
                      continue
                  yt_version = matches[0]

                  ipa_label   = ipa_name.replace('.ipa', '')
                  description = (
                      f"YouTube {yt_version} | {ipa_label}\n\n{release_body}"
                      if release_body else
                      f"YouTube {yt_version} | {ipa_label}"
                  )

                  entries.append({
                      "version":              yt_version,
                      "date":                 date_str,
                      "localizedDescription": description,
                      "downloadURL":          download_url,
                      "size":                 size,
                      "minOSVersion":         min_os,
                      "_tag":                 tag,
                  })

              if not entries:
                  print("No usable ytl-ipa releases found — skipping ytlite.json.")
              else:
                  with open(YTLITE_FILE, 'r') as f:
                      ytlite_source = json.load(f)

                  ytlite_app = ytlite_source['apps'][0]

                  existing_urls = [v.get('downloadURL') for v in ytlite_app.get('versions', [])]
                  new_urls      = [e['downloadURL'] for e in entries]

                  if existing_urls == new_urls:
                      print(f"{YTLITE_FILE} already up to date ({len(entries)} versions).")
                  else:
                      newest = entries[0]
                      for e in entries:
                          e.pop('_tag', None)

                      ytlite_app['versions']           = entries
                      ytlite_app['version']            = newest['version']
                      ytlite_app['versionDate']        = newest['date']
                      ytlite_app['versionDescription'] = newest['localizedDescription']
                      ytlite_app['downloadURL']        = newest['downloadURL']
                      ytlite_app['size']                = newest['size']

                      with open(YTLITE_FILE, 'w') as f:
                          json.dump(ytlite_source, f, indent=2, ensure_ascii=False)
                          f.write('\n')

                      print(f"Updated {YTLITE_FILE}: {len(entries)} versions kept (newest: YouTube {newest['version']})")
          PYEOF

      - name: Fetch YTMusicUltimate Latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, urllib.error, os, re, sys
          from datetime import datetime, timezone

          YTM_SOURCE_REPO = 'mrdrvt99/YTMusicUltimate'
          GH_TOKEN        = os.environ.get('GH_TOKEN', '')

          def fetch_json(url):
              headers = {'User-Agent': 'github-actions/altstore-sync'}
              if GH_TOKEN:
                  headers['Authorization'] = f'token {GH_TOKEN}'
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return json.loads(resp.read().decode())
              except urllib.error.URLError as e:
                  msg  = e.reason if hasattr(e, 'reason') else str(e)
                  code = e.code   if hasattr(e, 'code')   else 'N/A'
                  print(f"::error::YTMusic API request failed (HTTP {code}): {msg}")
                  sys.exit(1)

          releases = fetch_json(
              f'https://api.github.com/repos/{YTM_SOURCE_REPO}/releases?per_page=5'
          )
          release = next(
              (r for r in releases if not r['draft'] and not r['prerelease']),
              None
          )
          if release is None:
              print("No published release found — skipping.")
              sys.exit(0)

          ipa_asset = next(
              (a for a in release.get('assets', []) if a['name'].endswith('.ipa')),
              None
          )
          if not ipa_asset:
              print("No .ipa asset found — skipping.")
              sys.exit(0)

          download_url = ipa_asset['browser_download_url']
          size         = ipa_asset['size']
          ipa_name     = ipa_asset['name']
          published_at = release.get('published_at', '')
          date_str     = published_at[:10] if published_at else datetime.now(timezone.utc).strftime('%Y-%m-%d')
          release_body = (release.get('body') or '').strip()
          tag          = release['tag_name']

          with open('ytmusic.json', 'r') as f:
              ytm_data = json.load(f)

          ytm_app = ytm_data['apps'][0]

          if ytm_app.get('downloadURL') == download_url:
              print(f"ytmusic.json already up to date: {download_url}")
              sys.exit(0)

          matches = re.findall(r'(\d+\.\d+(?:\.\d+)?)', ipa_name)
          if len(matches) >= 2:
              tweak_version = matches[0]
              ytm_version   = matches[-1]
          elif len(matches) == 1:
              tweak_version = ytm_version = matches[0]
          else:
              tweak_version = ytm_version = tag.lstrip('v')

          ipa_label   = ipa_name.replace('.ipa', '')
          description = f"YTMusicUltimate {tweak_version} | YTMusic {ytm_version} | {ipa_label}"
          if release_body:
              description += f"\n\n{release_body}"

          new_entry = {
              "version":              tweak_version,
              "date":                 date_str,
              "localizedDescription": description,
              "downloadURL":          download_url,
              "size":                 size,
              "minOSVersion":         "16.0"
          }

          ytm_app['versions']           = [new_entry]
          ytm_app['version']            = tweak_version
          ytm_app['versionDate']        = date_str
          ytm_app['versionDescription'] = description
          ytm_app['downloadURL']        = download_url
          ytm_app['size']               = size

          with open('ytmusic.json', 'w') as f:
              json.dump(ytm_data, f, indent=2, ensure_ascii=False)
              f.write('\n')

          print(f"ytmusic.json updated: YTMusicUltimate {tweak_version} → YTMusic {ytm_version} ({tag})")
          PYEOF

      - name: Commit and Push changed source files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ytlite.json ytkp.json youpro.json youmod.json ytkace.json ytmusic.json
          if git diff --staged --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit -m "chore(altstore): sync latest release from YouProEXTRA & YTMusicUltimate"
            git pull --rebase
            git push
            echo "Source files committed and pushed."
          fi
