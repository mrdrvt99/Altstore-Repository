name: Check for Updates AIO

on:
  schedule:
    - cron: '0 */13 * * *'
  workflow_dispatch:

concurrency:
  group: sync-altstore-aio
  cancel-in-progress: false

jobs:
  sync:
    name: Check and Update apps.json
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout AltStore Repo
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Fetch YouProEXTRA Latest Release and Update apps.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, urllib.error, os, re, sys
          from datetime import datetime, timezone

          SOURCE_REPO = 'mrdrvt99/YouProEXTRA'
          GH_TOKEN    = os.environ.get('GH_TOKEN', '')

          TAG_TO_INFO = {
              'ytl-ipa':                   ("YoutubePlus (YTLite)",  "YTLite",       "dayanch96"),
              'ytkp-ipa':                  ("YTKillerPlus",          "YTKillerPlus", "iKarwan"),
              'ytkace-ipa':                ("YTKACE",                "YTKACE",       "itzzace0"),
              'youproextra-ipa':           ("YouPro",                "YouProExtra",  "alibusut"),
              'youmod-ipa':                ("YouMod",                "YouMod",       "Tonwalter888"),
          }

          def fetch_json(url):
              headers = {'User-Agent': 'github-actions/altstore-sync'}
              if GH_TOKEN:
                  headers['Authorization'] = f'token {GH_TOKEN}'
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return json.loads(resp.read().decode())
              except Exception as e:
                  print(f"::error::API request failed: {e}")
                  sys.exit(1)

          all_releases = fetch_json(
              f'https://api.github.com/repos/{SOURCE_REPO}/releases?per_page=20'
          )
          published = [r for r in all_releases if not r['draft'] and not r['prerelease']]

          best = {}
          for release in published:
              tag = release['tag_name']
              if tag.startswith('youproextra-noytlite-ipa'):
                  continue
              for prefix in TAG_TO_INFO:
                  if tag.startswith(prefix) and prefix not in best:
                      best[prefix] = release
                      break

          if not best:
              print("No matching releases found.")
              sys.exit(0)

          with open('apps.json', 'r') as f:
              data = json.load(f)

          order = ["YoutubePlus (YTLite)", "YTKillerPlus", "YTKACE", "YouPro", "YouMod"]

          for matched_prefix, release in best.items():
              tag                          = release['tag_name']
              base_name, mod_label, dev_name = TAG_TO_INFO[matched_prefix]
              published_at               = release.get('published_at') or datetime.now(timezone.utc).isoformat()
              date_str                   = published_at[:19] + "+03:00"
              release_body               = (release.get('body') or '').strip()

              ipa_asset = next(
                  (a for a in release.get('assets', []) if a['name'].endswith('.ipa')),
                  None
              )
              if not ipa_asset:
                  print(f"No .ipa asset for {tag} — skipping.")
                  continue

              download_url = ipa_asset['browser_download_url']
              size         = ipa_asset['size']
              ipa_name     = ipa_asset['name']

              current = next((a for a in data['apps'] if a['name'] == base_name), None)
              if current and current.get('downloadURL') == download_url:
                  print(f"apps.json already up to date for {base_name}.")
                  continue

              matches    = re.findall(r'(\d+\.\d+\.\d+)', ipa_name)
              yt_version = matches[0] if matches else "Unknown"

              version_description = yt_version

              loc_desc = f"[{mod_label}] YouTube {yt_version} | {ipa_name.replace('.ipa', '')}"
              if release_body:
                  loc_desc += f"\n\n{release_body}"

              new_entry = {
                  "name":                 base_name,
                  "bundleIdentifier":     "com.google.ios.youtube",
                  "developerName":        dev_name,
                  "version":              yt_version,
                  "versionDate":          date_str,
                  "versionDescription":   version_description,
                  "downloadURL":          download_url,
                  "localizedDescription": loc_desc,
                  "iconURL":              "https://raw.githubusercontent.com/mrdrvt99/Altstore-Repository/main/assets/YouTube.png",
                  "tintColor":            "FF0000",
                  "isLanZouCloud":        0,
                  "size":                 size,
                  "type":                 1
              }

              all_by_name          = {a['name']: a for a in data['apps']}
              all_by_name[base_name] = new_entry
              data['apps']         = [all_by_name[n] for n in order if n in all_by_name]

              print(f"Updated apps.json: {base_name} → YouTube {yt_version} ({tag})")

          with open('apps.json', 'w') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write('\n')
          PYEOF

      - name: Commit and Push apps.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(altstore): sync latest YouProEXTRA release"
            git pull --rebase
            git push
            echo "Changes committed and pushed."
          fi
