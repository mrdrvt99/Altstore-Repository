name: Check for Updates

on:
  schedule:
    - cron: '0 */18 * * *'
  workflow_dispatch:

concurrency:
  group: sync-altstore
  cancel-in-progress: false

jobs:
  sync:
    name: Check and Update source files
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout AltStore Repo
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Fetch YouProEXTRA Latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, urllib.error, os, re, sys
          from datetime import datetime, timezone

          SOURCE_REPO = 'mrdrvt99/YouProEXTRA'
          GH_TOKEN    = os.environ.get('GH_TOKEN', '')

          TAG_MAP = {
              'youmod-ipa':      'youmod',
              'youproextra-ipa': 'youpro',
              'ytkp-ipa':        'ytkp',
          }

          FILES = {
              'ytkp':   'ytkp.json',
              'youpro': 'youpro.json',
              'youmod': 'youmod.json',
          }

          MULTI_VERSION = {
              'ytl-ipa':    'ytlite.json',
              'ytkace-ipa': 'ytkace.json',
          }

          FIXED_YTL_VERSIONS = {
              1: "19.20.2-5.2.2",
              2: "20.21.6-5.2.2",
              3: "21.24.3-5.2.2",
          }

          def fetch_json(url):
              headers = {'User-Agent': 'github-actions/altstore-sync'}
              if GH_TOKEN:
                  headers['Authorization'] = f'token {GH_TOKEN}'
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return json.loads(resp.read().decode())
              except urllib.error.URLError as e:
                  msg  = e.reason if hasattr(e, 'reason') else str(e)
                  code = e.code   if hasattr(e, 'code')   else 'N/A'
                  print(f"::error::API request failed (HTTP {code}): {msg}")
                  sys.exit(1)

          def fetch_all_releases(repo, max_pages=10):
              results = []
              for page in range(1, max_pages + 1):
                  batch = fetch_json(
                      f'https://api.github.com/repos/{repo}/releases?per_page=100&page={page}'
                  )
                  if not batch:
                      break
                  results.extend(batch)
                  if len(batch) < 100:
                      break
              return results

          def get_min_os(yt_version):
              try:
                  parts = list(map(int, yt_version.split('.')))
                  major = parts[0]
                  minor = parts[1] if len(parts) > 1 else 0
              except (ValueError, IndexError):
                  return "17.0"
              if major == 19:
                  return "14.0"
              if major == 20:
                  return "15.0"
              if major == 21 and minor <= 33:
                  return "16.0"
              return "17.0"

          def tag_num(prefix, release):
              m = re.search(rf'{re.escape(prefix)}(\d+)', release['tag_name'])
              return int(m.group(1)) if m else -1

          all_releases = fetch_all_releases(SOURCE_REPO)
          published = [r for r in all_releases if not r['draft'] and not r['prerelease']]
          non_draft = [r for r in all_releases if not r['draft']]

          best = {}
          multi_releases = {prefix: [] for prefix in MULTI_VERSION}

          for release in non_draft:
              tag = release['tag_name']
              for prefix in MULTI_VERSION:
                  if tag.startswith(prefix):
                      multi_releases[prefix].append(release)
                      break

          for release in published:
              tag = release['tag_name']
              if tag.startswith('youproextra-noytlite-ipa'):
                  continue
              if any(tag.startswith(p) for p in MULTI_VERSION):
                  continue
              for prefix, key in TAG_MAP.items():
                  if tag.startswith(prefix) and key not in best:
                      best[key] = release
                      break

          if not best and not any(multi_releases.values()):
              print("No matching releases found.")
              sys.exit(0)

          for app_key, release in best.items():
              tag          = release['tag_name']
              published_at = release.get('published_at', '')
              date_str     = published_at[:10] if published_at else datetime.now(timezone.utc).strftime('%Y-%m-%d')
              release_body = (release.get('body') or '').strip()

              ipa_asset = next(
                  (a for a in release.get('assets', []) if a['name'].endswith('.ipa')),
                  None
              )
              if not ipa_asset:
                  print(f"No .ipa asset for {tag} — skipping.")
                  continue

              download_url = ipa_asset['browser_download_url']
              size         = ipa_asset['size']
              ipa_name     = ipa_asset['name']

              filename = FILES[app_key]
              with open(filename, 'r') as f:
                  source = json.load(f)

              app = source['apps'][0]

              if app.get('downloadURL') == download_url:
                  print(f"{filename} already up to date.")
                  continue

              matches = re.findall(r'(\d+\.\d+\.\d+)', ipa_name)
              if not matches:
                  print(f"::warning::Could not parse version from '{ipa_name}' — skipping.")
                  continue
              yt_version = matches[0]

              ipa_label = ipa_name.replace('.ipa', '')
              full_description = (
                  f"YouTube {yt_version} | {ipa_label}\n\n{release_body}"
                  if release_body else
                  f"YouTube {yt_version} | {ipa_label}"
              )

              new_entry = {
                  "version":              yt_version,
                  "date":                 date_str,
                  "localizedDescription": full_description,
                  "downloadURL":          download_url,
                  "size":                 size,
                  "minOSVersion":         get_min_os(yt_version)
              }

              app['versions']            = [new_entry]
              app['version']             = yt_version
              app['versionDate']         = date_str
              app['versionDescription']  = yt_version
              app['localizedDescription'] = full_description
              app['downloadURL']         = download_url
              app['size']                = size

              with open(filename, 'w') as f:
                  json.dump(source, f, indent=2, ensure_ascii=False)
                  f.write('\n')

              print(f"Updated {filename}: '{app['name']}' → YouTube {yt_version} ({tag})")

          for prefix, filename in MULTI_VERSION.items():
              releases = multi_releases.get(prefix, [])
              if not releases:
                  continue

              found_tags = sorted(r['tag_name'] for r in releases)
              print(f"Found {len(releases)} {prefix} release(s): {found_tags}")

              releases.sort(key=lambda r: tag_num(prefix, r), reverse=True)

              entries = []
              for release in releases:
                  tag          = release['tag_name']
                  published_at = release.get('published_at', '')
                  date_str     = published_at[:10] if published_at else datetime.now(timezone.utc).strftime('%Y-%m-%d')
                  release_body = (release.get('body') or '').strip()

                  ipa_asset = next(
                      (a for a in release.get('assets', []) if a['name'].endswith('.ipa')),
                      None
                  )
                  if not ipa_asset:
                      print(f"No .ipa asset for {tag} — skipping.")
                      continue

                  download_url = ipa_asset['browser_download_url']
                  size         = ipa_asset['size']
                  ipa_name     = ipa_asset['name']

                  matches = re.findall(r'(\d+\.\d+\.\d+)', ipa_name)
                  if not matches:
                      print(f"::warning::Could not parse version from '{ipa_name}' — skipping.")
                      continue
                  yt_version = matches[0]

                  version_field = yt_version
                  if prefix == 'ytl-ipa':
                      num = tag_num(prefix, release)
                      if num in FIXED_YTL_VERSIONS:
                          version_field = FIXED_YTL_VERSIONS[num]

                  ipa_label = ipa_name.replace('.ipa', '')
                  full_description = (
                      f"YouTube {yt_version} | {ipa_label}\n\n{release_body}"
                      if release_body else
                      f"YouTube {yt_version} | {ipa_label}"
                  )

                  entries.append({
                      "version":              version_field,
                      "date":                 date_str,
                      "localizedDescription": full_description,
                      "downloadURL":          download_url,
                      "size":                 size,
                      "minOSVersion":         get_min_os(yt_version),
                  })

              if not entries:
                  print(f"No usable {prefix} releases found — skipping {filename}.")
                  continue

              with open(filename, 'r') as f:
                  source = json.load(f)

              app = source['apps'][0]

              existing_urls = [v.get('downloadURL') for v in app.get('versions', [])]
              new_urls      = [e['downloadURL'] for e in entries]

              if existing_urls == new_urls:
                  print(f"{filename} already up to date ({len(entries)} versions).")
                  continue

              newest = entries[0]
              app['versions']             = entries
              app['version']              = newest['version']
              app['versionDate']          = newest['date']
              app['versionDescription']   = newest['version']
              app['localizedDescription'] = newest['localizedDescription']
              app['downloadURL']          = newest['downloadURL']
              app['size']                 = newest['size']

              with open(filename, 'w') as f:
                  json.dump(source, f, indent=2, ensure_ascii=False)
                  f.write('\n')

              print(f"Updated {filename}: {len(entries)} versions kept (newest: YouTube {newest['version']})")
          PYEOF

      - name: Fetch YTMusicUltimate Latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, urllib.error, os, re, sys
          from datetime import datetime, timezone

          YTM_SOURCE_REPO = 'mrdrvt99/YTMusicUltimate'
          GH_TOKEN        = os.environ.get('GH_TOKEN', '')

          def fetch_json(url):
              headers = {'User-Agent': 'github-actions/altstore-sync'}
              if GH_TOKEN:
                  headers['Authorization'] = f'token {GH_TOKEN}'
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return json.loads(resp.read().decode())
              except urllib.error.URLError as e:
                  msg  = e.reason if hasattr(e, 'reason') else str(e)
                  code = e.code   if hasattr(e, 'code')   else 'N/A'
                  print(f"::error::YTMusic API request failed (HTTP {code}): {msg}")
                  sys.exit(1)

          releases = fetch_json(
              f'https://api.github.com/repos/{YTM_SOURCE_REPO}/releases?per_page=5'
          )
          release = next(
              (r for r in releases if not r['draft'] and not r['prerelease']),
              None
          )
          if release is None:
              print("No published release found — skipping.")
              sys.exit(0)

          ipa_asset = next(
              (a for a in release.get('assets', []) if a['name'].endswith('.ipa')),
              None
          )
          if not ipa_asset:
              print("No .ipa asset found — skipping.")
              sys.exit(0)

          download_url = ipa_asset['browser_download_url']
          size         = ipa_asset['size']
          ipa_name     = ipa_asset['name']
          published_at = release.get('published_at', '')
          date_str     = published_at[:10] if published_at else datetime.now(timezone.utc).strftime('%Y-%m-%d')
          release_body = (release.get('body') or '').strip()
          tag          = release['tag_name']

          with open('ytmusic.json', 'r') as f:
              ytm_data = json.load(f)

          ytm_app = ytm_data['apps'][0]

          if ytm_app.get('downloadURL') == download_url:
              print(f"ytmusic.json already up to date: {download_url}")
              sys.exit(0)

          matches = re.findall(r'(\d+\.\d+(?:\.\d+)?)', ipa_name)
          if len(matches) >= 2:
              tweak_version = matches[0]
              ytm_version   = matches[-1]
          elif len(matches) == 1:
              tweak_version = ytm_version = matches[0]
          else:
              tweak_version = ytm_version = tag.lstrip('v')

          ipa_label   = ipa_name.replace('.ipa', '')
          full_description = f"YTMusicUltimate {tweak_version} | YTMusic {ytm_version} | {ipa_label}"
          if release_body:
              full_description += f"\n\n{release_body}"

          new_entry = {
              "version":              tweak_version,
              "date":                 date_str,
              "localizedDescription": full_description,
              "downloadURL":          download_url,
              "size":                 size,
              "minOSVersion":         "17.0"
          }

          ytm_app['versions']             = [new_entry]
          ytm_app['version']              = tweak_version
          ytm_app['versionDate']          = date_str
          ytm_app['versionDescription']   = tweak_version
          ytm_app['localizedDescription'] = full_description
          ytm_app['downloadURL']          = download_url
          ytm_app['size']                 = size

          with open('ytmusic.json', 'w') as f:
              json.dump(ytm_data, f, indent=2, ensure_ascii=False)
              f.write('\n')

          print(f"ytmusic.json updated: YTMusicUltimate {tweak_version} → YTMusic {ytm_version} ({tag})")
          PYEOF

      - name: Commit and Push changed source files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ytlite.json ytkp.json youpro.json youmod.json ytkace.json ytmusic.json
          if git diff --staged --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit -m "chore(altstore): sync latest release from YouProEXTRA & YTMusicUltimate"
            git pull --rebase
            git push
            echo "Source files committed and pushed."
          fi
