name: Check for Updates AIO

on:
  schedule:
    - cron: '0 */18 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force full rebuild of apps.json'
        required: false
        type: boolean
        default: false

concurrency:
  group: sync-altstore-aio
  cancel-in-progress: false

jobs:
  sync:
    name: Check and Update apps.json
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout AltStore Repo
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Fetch latest releases and update apps.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, urllib.error, os, re, sys
          from datetime import datetime, timezone

          GH_TOKEN = os.environ.get('GH_TOKEN', '')
          FORCE    = os.environ.get('FORCE', 'false').lower() == 'true'

          YT_REPO  = 'mrdrvt99/YouProEXTRA'
          YTM_REPO = 'mrdrvt99/YTMusicUltimate'

          TAG_TO_INFO = {
              'ytl-ipa':         ("YoutubePlus (YTLite)", "YTLite",       "dayanch96"),
              'ytkp-ipa':        ("YTKillerPlus",         "YTKillerPlus", "iKarwan"),
              'ytkace-ipa':      ("YTKACE",               "YTKACE",       "itzzace0"),
              'youproextra-ipa': ("YouPro",               "YouProExtra",  "alibusut"),
              'youmod-ipa':      ("YouMod",               "YouMod",       "Tonwalter888"),
          }

          IGNORE_PREFIXES = [
              'youproextra-noytlite-ipa',
          ]

          ORDER = [
              "YoutubePlus (YTLite)",
              "YTKillerPlus",
              "YTKACE",
              "YouPro",
              "YouMod",
              "YTMusicUltimate",
          ]

          updated = []
          skipped = []
          failed  = []

          def fetch_json(url):
              headers = {'User-Agent': 'github-actions/altstore-sync'}
              if GH_TOKEN:
                  headers['Authorization'] = f'token {GH_TOKEN}'
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return json.loads(resp.read().decode())
              except urllib.error.URLError as e:
                  msg  = e.reason if hasattr(e, 'reason') else str(e)
                  code = e.code   if hasattr(e, 'code')   else 'N/A'
                  print(f"::error::API request failed (HTTP {code}): {msg}")
                  sys.exit(1)

          def fetch_all_releases(repo, max_pages=5):
              results = []
              for page in range(1, max_pages + 1):
                  batch = fetch_json(
                      f'https://api.github.com/repos/{repo}/releases?per_page=100&page={page}'
                  )
                  if not batch:
                      break
                  results.extend(batch)
                  if len(batch) < 100:
                      break
              return results

          yt_releases = fetch_all_releases(YT_REPO)
          published_yt = [r for r in yt_releases if not r['draft'] and not r['prerelease']]

          best_yt = {}
          for release in published_yt:
              tag = release['tag_name']
              if any(tag.startswith(p) for p in IGNORE_PREFIXES):
                  continue
              for prefix in TAG_TO_INFO:
                  if tag.startswith(prefix) and prefix not in best_yt:
                      best_yt[prefix] = release
                      break

          ytm_releases = fetch_all_releases(YTM_REPO, max_pages=2)
          ytm_release = next(
              (r for r in ytm_releases if not r['draft'] and not r['prerelease']),
              None
          )

          with open('apps.json', 'r') as f:
              data = json.load(f)

          all_by_name = {a['name']: a for a in data.get('apps', [])}

          for matched_prefix, release in best_yt.items():
              tag = release['tag_name']
              base_name, mod_label, dev_name = TAG_TO_INFO[matched_prefix]
              published_at = release.get('published_at') or datetime.now(timezone.utc).isoformat()
              date_str = published_at[:19] + "Z"
              release_body = (release.get('body') or '').strip()

              ipa_asset = next(
                  (a for a in release.get('assets', []) if a['name'].endswith('.ipa')),
                  None
              )
              if not ipa_asset:
                  print(f"No .ipa asset for {tag} — skipping.")
                  failed.append(f"{base_name} ({tag})")
                  continue

              download_url = ipa_asset['browser_download_url']
              size = ipa_asset['size']
              ipa_name = ipa_asset['name']

              matches = re.findall(r'(\d+\.\d+\.\d+)', ipa_name)
              yt_version = matches[0] if matches else "Unknown"

              current = all_by_name.get(base_name)
              if not FORCE and current and current.get('downloadURL') == download_url and current.get('version') == yt_version:
                  print(f"{base_name} already up to date.")
                  skipped.append(base_name)
                  continue

              loc_desc = f"[{mod_label}] YouTube {yt_version} | {ipa_name.replace('.ipa', '')}"
              if release_body:
                  loc_desc += f"\n\n{release_body}"

              new_entry = {
                  "name":                 base_name,
                  "bundleIdentifier":     "com.google.ios.youtube",
                  "developerName":        dev_name,
                  "version":              yt_version,
                  "versionDate":          date_str,
                  "versionDescription":   yt_version,
                  "downloadURL":          download_url,
                  "localizedDescription": loc_desc,
                  "iconURL":              "https://raw.githubusercontent.com/mrdrvt99/Altstore-Repository/main/assets/YouTube.png",
                  "tintColor":            "FF0000",
                  "isLanZouCloud":        0,
                  "size":                 size,
                  "type":                 1
              }

              all_by_name[base_name] = new_entry
              print(f"Updated {base_name} → YouTube {yt_version} ({tag})")
              updated.append(base_name)

          if ytm_release:
              tag = ytm_release['tag_name']
              published_at = ytm_release.get('published_at') or datetime.now(timezone.utc).isoformat()
              date_str = published_at[:19] + "Z"
              release_body = (ytm_release.get('body') or '').strip()

              ipa_asset = next(
                  (a for a in ytm_release.get('assets', []) if a['name'].endswith('.ipa')),
                  None
              )
              if ipa_asset:
                  download_url = ipa_asset['browser_download_url']
                  size = ipa_asset['size']
                  ipa_name = ipa_asset['name']

                  matches = re.findall(r'(\d+\.\d+(?:\.\d+)?)', ipa_name)
                  if len(matches) >= 2:
                      tweak_version = matches[0]
                      ytm_version = matches[-1]
                  elif len(matches) == 1:
                      tweak_version = ytm_version = matches[0]
                  else:
                      tweak_version = ytm_version = tag.lstrip('v')

                  base_name = "YTMusicUltimate"
                  current = all_by_name.get(base_name)
                  if not FORCE and current and current.get('downloadURL') == download_url and current.get('version') == ytm_version:
                      print(f"{base_name} already up to date.")
                      skipped.append(base_name)
                  else:
                      loc_desc = f"YTMusicUltimate {tweak_version} | YTMusic {ytm_version} | {ipa_name.replace('.ipa', '')}"
                      if release_body:
                          loc_desc += f"\n\n{release_body}"

                      new_entry = {
                          "name":                 base_name,
                          "bundleIdentifier":     "com.google.ios.youtubemusic",
                          "developerName":        "mrdrvt99",
                          "version":              ytm_version,          # ← YTMusic app version (e.g. 9.45)
                          "versionDate":          date_str,
                          "versionDescription":   ytm_version,
                          "downloadURL":          download_url,
                          "localizedDescription": loc_desc,
                          "iconURL":              "https://raw.githubusercontent.com/mrdrvt99/Altstore-Repository/main/assets/YTMusic.png",
                          "tintColor":            "FF0000",
                          "isLanZouCloud":        0,
                          "size":                 size,
                          "type":                 1
                      }

                      all_by_name[base_name] = new_entry
                      print(f"Updated {base_name} → YTMusic {ytm_version} ({tag})")
                      updated.append(base_name)
              else:
                  print("No .ipa asset for YTMusicUltimate — skipping.")
                  failed.append("YTMusicUltimate: no ipa")
          else:
              print("No published YTMusicUltimate release found.")
              failed.append("YTMusicUltimate: no release")

          data['apps'] = [all_by_name[n] for n in ORDER if n in all_by_name]

          with open('apps.json', 'w') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write('\n')

          print("\n=== SUMMARY ===")
          print(f"Updated : {updated or 'none'}")
          print(f"Skipped : {skipped or 'none'}")
          print(f"Failed  : {failed or 'none'}")
          if FORCE:
              print("(force mode was enabled)")
          PYEOF

      - name: Commit and Push apps.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(altstore): sync latest YouProEXTRA & YTMusicUltimate"
            git pull --rebase
            git push
            echo "Changes committed and pushed."
          fi
